spring:
  application:
    name: outcomeprobe-server
  threads:
    virtual:
      enabled: true
  datasource:
    # stringtype=unspecified는 String 바인딩을 uuid·jsonb 컬럼 문맥에서 서버가 추론하게 한다.
    url: jdbc:postgresql://${OUTCOMEPROBE_DB_HOST:localhost}:${OUTCOMEPROBE_DB_PORT:5432}/${OUTCOMEPROBE_DB_NAME:outcomeprobe}?stringtype=unspecified
    username: ${OUTCOMEPROBE_DB_USER:outcomeprobe}
    password: ${OUTCOMEPROBE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${OUTCOMEPROBE_SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

outcomeprobe:
  version: 0.1.0
  security:
    control-api-token: ${OUTCOMEPROBE_CONTROL_API_TOKEN}
  retention:
    days: ${OUTCOMEPROBE_RETENTION_DAYS:14}
  limits:
    max-concurrent-runs: ${OUTCOMEPROBE_MAX_CONCURRENT_RUNS:10}
  emulator:
    token: ${OUTCOMEPROBE_EMULATOR_TOKEN:}
  demo:
    profile-seeding-enabled: ${OUTCOMEPROBE_DEMO_PROFILE_SEEDING_ENABLED:false}
  secrets:
    # 비어 있으면 환경변수 resolver만 사용한다. 각 파일명은 secretRef와 같아야 한다.
    directory: ${OUTCOMEPROBE_SECRETS_DIRECTORY:}

logging:
  level:
    io.outcomeprobe: ${OUTCOMEPROBE_LOG_LEVEL:INFO}
