services:
  outcomeprobe-server:
    volumes:
      - type: bind
        source: ${OUTCOMEPROBE_SECRETS_HOST_DIRECTORY:?OUTCOMEPROBE_SECRETS_HOST_DIRECTORY must be set}
        target: /run/outcomeprobe-secrets
        read_only: true
    environment:
      OUTCOMEPROBE_SECRETS_DIRECTORY: /run/outcomeprobe-secrets
