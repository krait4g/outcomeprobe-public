apiVersion: outcomeprobe.io/v1alpha1
kind: TargetProfile
metadata:
  name: resilient-consumer
  displayName: Resilient Reference Consumer
  version: 1.0.0
spec:
  baseUri: "http://rr-resilient:8092"
  allowedPaths:
    - /api/payments/**
    - /test-support/reset
    - /test-support/payments/**
    - /webhooks/payments
  allowedMethods:
    - GET
    - POST
  allowedHosts:
    - rr-resilient
  allowedPorts:
    - 8092
  callbackPaths:
    paymentSucceeded: /webhooks/payments
  redaction:
    headers:
      - Authorization
      - Cookie
    jsonPaths: []
