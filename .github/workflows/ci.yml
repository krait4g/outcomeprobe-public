name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Public JVM build and selected unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@fbcece063590cf3e99cc8f93ed063231c98bf95b # v5.0.1
      - name: Build public JVM modules and run the selected public unit tests
        run: ./gradlew clean build --stacktrace

  public-contract:
    name: Public configuration and evidence contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Run the public host-path policy regression
        run: python3 scripts/core-release-staging/tests/test_host_path_policy.py
      - name: Run the public Compose contract regressions
        run: |
          python3 -m unittest discover \
            -s scripts/config-contract/tests \
            -p 'test_*.py'
          python3 scripts/config-contract/verify_compose_env_contract.py
      - name: Run the normalized browser evidence regression
        run: node --test scripts/core-release-staging/create-web-ux-summary.test.mjs

  web:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Audit frontend dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Run frontend tests
        run: npm --prefix web run test
      - name: Build frontend
        run: npm --prefix web run build

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fail on obvious secret patterns
        run: |
          if grep -rInE "(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle .; then
            echo "secret pattern detected" >&2
            exit 1
          fi
          echo "no obvious secret patterns"
